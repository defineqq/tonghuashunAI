[pytest]
# 只收集本仓库自研代码的测试，vendor/Qbot 的测试需要 tushare/joinquant token，跳过
testpaths =
    data_layer/tests
    analysis/tests
    ai_analysis/tests
    paper_trade/tests
    backtest/tests
    notify/tests
    strategies/tests
    execution/tests

# 排除 vendor 目录
norecursedirs = vendor .git .venv data logs

# 简化输出
addopts = -v --tb=short
