# 股票池配置
# 起步用沪深 300 成分股（可通过 akshare.index_stock_cons_csindex("000300") 拉取实时成分）
# 你可以在 custom 里加自选清单，策略优先使用 custom，如果为空则用 index

use: index               # index | custom
index: "000300"          # 000300=沪深300, 000905=中证500, 000852=中证1000

# 手动指定股票池（use=custom 时生效）
custom:
  # - "600519"    # 贵州茅台
  # - "000858"    # 五粮液
  # - "300750"    # 宁德时代

# 过滤规则
filters:
  exclude_st: true             # 剔除 ST 股
  exclude_new_days: 60         # 剔除上市不足 N 天的新股
  min_market_cap_yi: 50        # 最小总市值（亿元）
  min_avg_volume_wan: 1000     # 最小 20 日平均成交量（万手）
