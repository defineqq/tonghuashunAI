id: limitup_fanbao_nextday_v4
name: 涨停反包次日买入（精细模拟版）
description: T-2日真实涨停，T-1日高开反包且量能活跃，T日开盘买入；持仓最多3日，盈利15%或亏损7%止损离场
buy:
  logic: AND
  rules:
  - indicator: LIMIT
    op: prev_up
    params: {}
    value: 2
  - indicator: REL_PRICE
    op: open_above_close_pct
    params:
      n: 1
    value: 0.0
  - indicator: PRICE_PCT
    op: '>'
    params:
      n: 1
    value: 0.0
  - indicator: VOLUME_RATIO
    op: '>'
    params:
      n: 1
    value: 0.8
sell:
  logic: OR
  rules:
  - indicator: PRICE_PCT
    op: '>'
    params:
      n: 1
    value: 15.0
  - indicator: PRICE_PCT
    op: <
    params:
      n: 1
    value: -7.0
notes: '【指标映射说明与近似处理】


  1. **T-2日涨停**：使用 `LIMIT.prev_up value=2` 表示「前2日内出现过涨停」。由于条件构建器没有精确指定「恰好第2日」涨停的能力，此处为近似（含前1日涨停的情况）。更精确的「T-2日」定位无法在现有指标中单独实现。


  2. **T-1日高开**：使用 `REL_PRICE.open_above_close_pct n=1 value=0.0`，即今日开盘价高于前1日收盘价（高开幅度>0%）。


  3. **T-1日收阳反包（收盘>开盘）**：现有指标无法直接比较当日收盘与当日开盘。用 `PRICE_PCT.> n=1 value=0.0` 近似替代「今日收盘相对昨日收盘为正」，间接体现收阳。收盘>开盘的精确判断无法在现有指标中实现，已在notes说明。


  4. **量能活跃（今日量>昨日量×0.8）**：使用 `VOLUME_RATIO.> n=1 value=0.8`，即近5日均量/近1日均量>0.8，近似表达量能不萎缩。VOLUME_RATIO定义为「近5日均量/近N日均量」，此处n=1以近似「当日量与昨日量」之比，存在一定偏差，属于最接近的替代方案。


  5. **T日开盘买入且开盘非涨停**：买入信号在T-1日确认后T日开盘执行，「若T日开盘即涨停则跳过」的逻辑需在回测引擎层面实现，条件构建器中无法在买入规则里判断「未来开盘价」，建议在回测参数中设置「涨停开盘不追入」。


  6. **卖出：盈利15%或亏损7%**：使用 `PRICE_PCT.> value=15.0` 和 `PRICE_PCT.< value=-7.0`（以买入当日为基准的涨跌幅）作为止盈止损条件，逻辑为OR（任一触发即卖）。注意
  PRICE_PCT 的 n 参数这里设为1（当日涨跌幅），持仓期间的累计盈亏判断建议在回测引擎层面以买入价为基准计算，而非单日涨跌幅。


  7. **持仓最多3日强制卖出**：时间计数型离场条件构建器不支持，需在回测参数中设置「最大持仓天数=3」。


  8. **跌停无法卖出顺延**：此逻辑属于回测撮合层面的处理，条件构建器不支持，建议在回测引擎设置「跌停日不成交，顺延至下一个非跌停日」。


  9. **仓位管理（最多N只等权）**：属于组合管理参数，需在回测框架中配置，条件构建器不处理仓位。'
