id: limitup_fanbao_precise_v2
name: 涨停反包次日买入精确版
description: T-2日真实涨停封板，T-1日高开阳线反包且放量，T日开盘买入；止盈15%或止损7%或持满3日卖出
buy:
  logic: AND
  rules:
  - indicator: LIMIT
    op: prev_up
    params: {}
    value: 2
  - indicator: REL_PRICE
    op: open_above_close_pct
    params:
      n: 1
    value: 0.1
  - indicator: PRICE_PCT
    op: '>'
    params:
      n: 1
    value: 0.1
  - indicator: VOLUME
    op: surge
    params:
      n: 5
    value: 1.5
sell:
  logic: OR
  rules:
  - indicator: PRICE_PCT
    op: '>'
    params:
      n: 1
    value: 15.0
  - indicator: PRICE_PCT
    op: <
    params:
      n: 1
    value: -7.0
  - indicator: ATR
    op: stop_hit
    params:
      n: 3
    value: 1.5
notes: '【买入条件映射说明】

  1. 「T-2日真实涨停封板」：使用 LIMIT.prev_up value=2 表示前2日内出现过涨停；「收盘价等于最高价（封板）」这一精确条件（收盘=最高）现有指标无法直接表达，已用
  LIMIT.prev_up 近似，实际封板判断建议在回测引擎层面额外过滤。

  2. 「T-1日高开（今开>昨收）」：使用 REL_PRICE.open_above_close_pct n=1 value=0.1，即今日开盘高于前1日收盘超过0.1%（近似正向高开）。

  3. 「T-1日阳线反包（收盘>开盘且收盘>T-2日收盘）」：使用 PRICE_PCT.> n=1 value=0.1，表示今日涨幅大于0.1%（正收益，近似阳线且高于T-2收盘）；收盘>开盘的纯阳线判断现有指标无直接对应，已用涨幅>0近似。

  4. 「成交量>5日均量1.5倍」：使用 VOLUME.surge n=5 value=1.5，精确匹配。


  【买入执行注意】「T日开盘已涨停则不买入」的逻辑（今开>=昨收*1.099）对应 REL_PRICE.open_above_close_pct value=9.9
  时排除，该过滤条件在 JSON 策略层无法用 AND NOT 表达，建议在回测引擎的订单执行逻辑中实现：检测到开盘涨停则撤单跳过。


  【卖出条件映射说明】

  - 止盈15%：PRICE_PCT.> n=1 value=15.0，当日涨幅超15%触发（日内tick级别监控需引擎支持盘中检查）。

  - 止损7%：PRICE_PCT.< n=1 value=-7.0，当日跌幅超7%触发。

  - 「持满3个交易日强制卖出」：条件构建器不支持持仓天数计数，已用 ATR.stop_hit n=3 近似为3日追踪止损辅助退出；精确的「持满3日」逻辑建议在回测引擎的持仓管理模块中单独配置最大持仓天数=3。

  - 跌停无法卖出的顺延逻辑同样需引擎层面支持，JSON 策略层无法表达。


  【风控说明】最大持仓20只、等权仓位分配属于资金管理层参数，不在条件构建器规则范围内，请在回测/实盘系统的仓位管理模块中配置。'
