id: limitup_fanbao_v9
name: 涨停反包次日买入策略
description: T-1日涨停封板，T日高开反包阳线且量能放大但未再涨停，T+1日开盘买入；持仓最多3日，止盈15%或止损7%
buy:
  logic: AND
  rules:
  - indicator: LIMIT
    op: yesterday_up
    params: {}
  - indicator: REL_PRICE
    op: open_above_close_pct
    params:
      n: 1
    value: 0.0
  - indicator: PRICE_PCT
    op: '>'
    params:
      n: 1
    value: 0.0
  - indicator: VOLUME
    op: surge
    params:
      n: 20
    value: 1.2
sell:
  logic: OR
  rules:
  - indicator: PRICE_PCT
    op: '>'
    params:
      n: 1
    value: 15.0
  - indicator: PRICE_PCT
    op: <
    params:
      n: 1
    value: -7.0
  - indicator: LIMIT
    op: down
    params: {}
notes: '【指标映射说明】

  1. T-1日涨停：使用 LIMIT.yesterday_up，表示昨日涨停（不用 LIMIT.up，后者是今日涨停，两者AND会导致零成交）。

  2. T日高开（开盘>T-1收盘）：使用 REL_PRICE.open_above_close_pct n=1 value=0.0，即今开高于前1日收盘0%以上；用户原始要求是任意高开，value=0即可，如需严格高开可适当调高阈值。

  3. T日反包阳线（收盘>开盘且收盘>T-1收盘）：使用 PRICE_PCT.> n=1 value=0.0 近似表达收盘相对T-1收盘上涨；收盘>开盘（阳线）条件在现有指标中无法精确表达，已合并入「涨幅>0」近似。

  4. T日量能活跃（T日量>T-2日量×1.2）：使用 VOLUME.surge n=20 value=1.2 近似，原始逻辑是比T-2日量放大1.2倍，但现有指标仅支持近N日均量对比，此处用近20日均量放量1.2倍近似，实际效果有偏差，请注意。

  5. T日未再涨停：现有指标无法直接排除「今日涨停」，LIMIT.up 表示今日涨停，但无「排除」逻辑。此约束无法在JSON规则中用NOT表达，建议在回测引擎层做过滤。

  6. 【T+1日开盘买入 & 开盘涨停则跳过】：条件构建器为信号日触发逻辑，次日以开盘价买入及开盘涨停跳过属于订单执行层逻辑，无法在此JSON中表达，需在回测/实盘执行引擎中实现。

  7. 卖出止盈15%/止损7%：使用 PRICE_PCT 近似，实际应为持仓成本的涨跌幅，条件构建器以信号日为基准，精确的持仓盈亏判断需在回测引擎中实现（用当日最高/最低价判断是否触及）。

  8. 持有最多3个交易日强制卖出：条件构建器不支持持仓时间计数，请在回测参数中单独设置最大持仓天数=3。

  9. 跌停日以跌停价×0.99卖出：属于滑点/成交模拟逻辑，需在回测引擎中配置，已在sell规则中加入 LIMIT.down 作为卖出触发信号。

  10. 风控（单仓≤10%，最多20只）：属于资金管理参数，需在回测引擎的仓位管理模块中设置。'
